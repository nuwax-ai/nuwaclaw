packages:
  - 'crates/*'

overrides:
  protobufjs: '>=7.5.6'
  '@protobufjs/utf8': '>=1.1.1'
  tar: '>=7.5.8'
  picomatch: '>=4.0.4'
  fast-uri: '>=2.4.1'
  xmldom: '>=0.6.0'
  i18next-http-backend: '>=3.0.5'
  path-to-regexp: '>=0.7.3'
  flatted: '>=0.2.0'
  axios: '>=1.8.4'
  basic-ftp: '>=5.2.1'
  fast-xml-parser: '>=4.8.1'
  lodash: '>=4.17.31'

# pnpm 11+：非交互环境（含 git hook）下跳过 node_modules 清理确认
confirmModulesPurge: false

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  protobufjs: true
  sharp: true
