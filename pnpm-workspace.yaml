packages:
  - 'crates/*'
  # agent-kit 走 npm 发布版独立维护,不再作为 workspace 成员
  # (避免 electron-builder asar 拒绝符号链接到外部的 workspace 包)
  - '!crates/agent-kit'

# pnpm 11+：非交互环境（含 git hook）下跳过 node_modules 清理确认
confirmModulesPurge: false

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  protobufjs: true
  sharp: true
