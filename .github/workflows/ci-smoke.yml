# submodule 连通性探针（手动触发）
#
# 验证基座 submodule 在 CI 环境可拉取：nuwa-electron-shell（基座仓
# nuwax-ai/nuwa-electron-shell community/main 线，走 github.token）。
# community 线基座无嵌套子模块（不内嵌 nuwax 前端——webview 走配置域直连）。
# 与 release workflow 的 Init submodules 步骤同构，在不动发布 tag 的情况下即可
# 回归验证以下变更：
#   - .gitmodules URL 变更 / pin bump
name: CI Smoke (submodules)

on:
  workflow_dispatch:

jobs:
  submodules:
    name: Init submodules probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules (nuwa-electron-shell)
        shell: bash
        env:
          GH_SUBMODULE_TOKEN: ${{ github.token }}
        run: |
          export GH_TOKEN="${GH_SUBMODULE_TOKEN}"
          gh auth setup-git
          git submodule update --init nuwa-electron-shell
          git submodule status
          # 勿在 nuwa-electron-shell 内再跑 submodule status / --recursive：base 树有 vcpkg
          # 孤儿 gitlink（无 .gitmodules 条目）会 fatal 128

      - name: Assert
        run: |
          test -d nuwa-electron-shell/crates/agent-electron-client || { echo "::error::nuwa-electron-shell submodule not checked out"; exit 1; }
          echo "submodule topology OK (shell@$(git -C nuwa-electron-shell rev-parse --short HEAD))"
